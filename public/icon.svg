<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="waslaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="50%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Background with rounded app icon shape -->
  <rect width="512" height="512" rx="115" fill="url(#waslaGrad)" />
  <!-- Inner subtle border -->
  <rect x="8" y="8" width="496" height="496" rx="108" fill="none" stroke="#ffffff" stroke-opacity="0.15" stroke-width="4"/>
  <!-- Decorative stylized plane and package lines -->
  <path d="M120 380 L392 380" stroke="#ffffff" stroke-width="12" stroke-linecap="round" stroke-opacity="0.2"/>
  <path d="M160 410 L352 410" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-opacity="0.1"/>
  <!-- Wasla Arabic Letter "و" in modern calligraphy -->
  <text x="256" y="330" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Tahoma, Arial, sans-serif" font-size="280" font-weight="900" fill="#ffffff" text-anchor="middle" filter="url(#shadow)">و</text>
  <!-- Small accent airplane -->
  <path d="M370 140 L400 170 L380 180 L355 170 L345 185 L335 180 L342 165 L325 155 L330 145 L355 155 Z" fill="#34d399"/>
</svg>
